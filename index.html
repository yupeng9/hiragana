<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiragana Practice</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8378;
    --accent: #c8433a;
    --good: #3f8f5a;
    --bad: #c8433a;
    --line: #e7e1d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  nav button {
    border: none; background: none; font-size: 15px; padding: 8px 14px;
    cursor: pointer; color: var(--muted); border-radius: 8px;
  }
  nav button.active { color: var(--ink); background: var(--bg); font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .view { display: none; }
  .view.active { display: block; }

  .rows { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .rows label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    cursor: pointer; font-size: 14px; user-select: none;
  }
  .rows label.on { border-color: var(--accent); background: #fbecea; }
  .rows input { display: none; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; color: var(--muted); font-size: 14px; }
  select { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 32px 24px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .prompt { font-size: 120px; line-height: 1.1; margin: 8px 0 4px; min-height: 140px; }
  .prompt.romaji { font-size: 72px; font-family: ui-monospace, Menlo, monospace; padding-top: 30px; }
  .hint { color: var(--muted); font-size: 14px; min-height: 20px; }
  .answer-input {
    font-size: 28px; text-align: center; width: 220px; padding: 10px;
    border: 2px solid var(--line); border-radius: 12px; outline: none; margin-top: 16px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .answer-input:focus { border-color: var(--ink); }
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
  .choices button {
    font-size: 48px; padding: 14px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--card); cursor: pointer; position: relative;
  }
  .choices button:hover:not(:disabled) { border-color: var(--ink); }
  .choices button small { position: absolute; top: 6px; left: 10px; font-size: 12px; color: var(--muted); }
  .choices button.correct { border-color: var(--good); background: #e9f5ed; }
  .choices button.wrong { border-color: var(--bad); background: #fbecea; }
  .feedback { font-size: 18px; min-height: 28px; margin-top: 16px; font-weight: 600; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .actions { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
  .btn {
    font-size: 15px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
  .session { display: flex; justify-content: center; gap: 24px; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .session b { color: var(--ink); }

  table.chart { border-collapse: separate; border-spacing: 8px; margin: 0 auto; }
  table.chart th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .cell {
    width: 76px; height: 82px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--line); text-align: center; cursor: pointer; vertical-align: middle;
  }
  .cell .k { font-size: 34px; display: block; }
  .cell .r { font-size: 12px; color: var(--muted); }
  .cell.empty { background: transparent; border: none; cursor: default; }
  .cell.off { opacity: .35; }
  .legend { display: flex; gap: 14px; justify-content: center; margin: 18px 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .m0 { background: #ffffff; } .m1 { background: #fde2dc; } .m2 { background: #fdf0cf; }
  .m3 { background: #e3f1d9; } .m4 { background: #c6e6cf; } .m5 { background: #9fd6b0; }
  .muted { color: var(--muted); font-size: 14px; text-align: center; }
  .weak { margin-top: 18px; text-align: center; }
  .weak span { font-size: 28px; margin: 0 6px; }

  .examples { margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 16px; }
  .examples:empty { display: none; }
  .examples h3 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .word-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .word {
    text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    padding: 10px 12px; cursor: pointer; font: inherit; color: inherit;
  }
  .word { position: relative; }
  .word:hover { border-color: var(--ink); }
  .word.locked { cursor: default; }
  .word.locked:hover { border-color: var(--line); }
  .word.locked .wr { font-style: italic; }
  .word .wd { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .star {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    font-size: 20px; cursor: pointer; color: var(--muted); padding: 2px;
  }
  .star.on { color: #e0a100; }
  .word .wk { font-size: 24px; }
  /* pitch accent: line over high morae, tick down where the pitch drops */
  .word .wk .m { display: inline-block; border-top: 2px solid transparent; padding-top: 3px; line-height: 1.15; }
  .word .wk .m.hi { border-top-color: #4a6fa5; }
  .word .wk .m.drop { border-right: 2px solid #4a6fa5; }
  .word .wk .acc { font-size: 16px; color: #4a6fa5; margin-left: 4px; cursor: help; vertical-align: 2px; }
  .word .wk mark { background: #fbecea; color: var(--accent); border-radius: 4px; padding: 0 1px; }
  .word .wj { font-size: 15px; color: var(--muted); margin-left: 6px; }
  .word .wr { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  .word .wt { display: block; font-size: 14px; margin-top: 4px; }
  .word .wt span { color: var(--muted); }
  #chartWords { margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>ひらがな <span>Practice</span></h1>
  <nav>
    <button data-view="practice" class="active">Practice</button>
    <button data-view="chart">Chart</button>
    <button data-view="words">Words</button>
    <button data-view="dictionary">My Dictionary</button>
    <button data-view="progress">Progress</button>
  </nav>
</header>

<main>
  <!-- Practice -->
  <section id="practice" class="view active">
    <div class="rows" id="rowToggles"></div>
    <div class="controls">
      Mode:
      <select id="mode">
        <option value="type">See kana → type romaji</option>
        <option value="pick">See romaji → pick kana</option>
        <option value="mixed">Mixed</option>
      </select>
      <label><input type="checkbox" id="autoSpeak"> Speak answer</label>
    </div>

    <div class="card">
      <div class="hint" id="hint"></div>
      <div class="prompt" id="prompt"></div>
      <div id="answerArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn" id="speakBtn" title="Hear pronunciation">🔊 Listen</button>
        <button class="btn primary" id="nextBtn" style="display:none">Next ↵</button>
      </div>
      <div class="examples" id="examples"></div>
    </div>

    <div class="session">
      <div>Session: <b id="sCorrect">0</b> / <b id="sTotal">0</b></div>
      <div>Streak: <b id="sStreak">0</b></div>
      <div>Best streak: <b id="sBest">0</b></div>
    </div>
  </section>

  <!-- Chart -->
  <section id="chart" class="view">
    <p class="muted">Click any character to hear it and see example words. Faded rows are not in your practice set.</p>
    <div id="chartTable"></div>
    <div class="examples" id="chartWords"></div>
  </section>

  <!-- Words -->
  <section id="words" class="view">
    <p class="muted" id="wordsInfo"></p>
    <div class="word-list" id="wordsList"></div>
  </section>

  <!-- Dictionary -->
  <section id="dictionary" class="view">
    <p class="muted" id="dictInfo"></p>
    <div class="word-list" id="dictList"></div>
  </section>

  <!-- Progress -->
  <section id="progress" class="view">
    <div class="legend">
      <span><i class="m0" style="border:1px solid #ddd"></i>New</span>
      <span><i class="m1"></i>Struggling</span>
      <span><i class="m2"></i>Learning</span>
      <span><i class="m3"></i>Familiar</span>
      <span><i class="m4"></i>Good</span>
      <span><i class="m5"></i>Mastered</span>
    </div>
    <div id="progressTable"></div>
    <div class="weak" id="weakList"></div>
    <div class="actions" style="margin-top:24px">
      <button class="btn" id="resetBtn">Reset progress</button>
    </div>
  </section>
</main>

<script>
// ---------- Data ----------
// Each row: id, label, and 5 slots [kana, romaji, ...alternate spellings] (null = empty slot)
const ROWS = [
  { id: "a",  label: "a",  chars: [["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"]] },
  { id: "ka", label: "ka", chars: [["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"]] },
  { id: "sa", label: "sa", chars: [["さ","sa"],["し","shi","si"],["す","su"],["せ","se"],["そ","so"]] },
  { id: "ta", label: "ta", chars: [["た","ta"],["ち","chi","ti"],["つ","tsu","tu"],["て","te"],["と","to"]] },
  { id: "na", label: "na", chars: [["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"]] },
  { id: "ha", label: "ha", chars: [["は","ha"],["ひ","hi"],["ふ","fu","hu"],["へ","he"],["ほ","ho"]] },
  { id: "ma", label: "ma", chars: [["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"]] },
  { id: "ya", label: "ya", chars: [["や","ya"],null,["ゆ","yu"],null,["よ","yo"]] },
  { id: "ra", label: "ra", chars: [["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"]] },
  { id: "wa", label: "wa", chars: [["わ","wa"],null,null,null,["を","wo","o"]] },
  { id: "n",  label: "n",  chars: [["ん","n","nn"],null,null,null,null] },

const DEFAULT_ROWS = ["a", "ka", "sa", "ta"];  // rows learned so far
const MAX_BOX = 5;

const ALL = ROWS.flatMap(r => r.chars.filter(Boolean).map(([kana, romaji, ...alts]) =>
  ({ kana, romaji, accepted: [romaji, ...alts], row: r.id })));

// Example words: [kana, romaji, kanji (or "" if usually written in kana), English, Chinese,
// pitch accent]. Pitch accent is the Tokyo-standard dictionary number: the mora after which
// the pitch drops (0 = flat, never drops).
// Only words spelled with basic hiragana (no ゛゜ or small kana). A word is shown only
// once every character in it belongs to the practice set, so the list grows with each row.
const WORDS = [
  // あ か さ た rows only

  ["かたち","katachi","形","shape","形状",0],
  ["きく","kiku","聞く","to listen; to ask","听；问",0],
  ["きせつ","kisetsu","季節","season","季节",1],
  ["きた","kita","北","north","北",0],
  ["くさ","kusa","草","grass","草",2],

  ["いぬ","inu","犬","dog","狗",2],

  ["はな","hana","花","flower","花",2],

  ["かわ","kawa","川","river","河",2],

  ["ほん","hon","本","book","书",1],
  ["にほん","nihon","日本","Japan","日本",2],
  ["みかん","mikan","蜜柑","mandarin orange","橘子",1],
  ["てんき","tenki","天気","weather","天气",1],
  ["せんせい","sensei","先生","teacher","老师",3],
  ["おかあさん","okaasan","お母さん","mother","妈妈",2],
  ["こんにちは","konnichiwa","今日は","hello; good afternoon","你好",0],
  ["さようなら","sayounara","","goodbye","再见",4],
].map(([kana, romaji, kanji, en, zh, accent]) => ({ kana, romaji, kanji, en, zh, accent }));

// ---------- Storage ----------
const STORE_KEY = "hiragana-practice-v1";
const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
const state = {
  rows: saved.rows || DEFAULT_ROWS,
  mode: saved.mode || "type",
  autoSpeak: saved.autoSpeak ?? false,
  bestStreak: saved.bestStreak || 0,
  // per-kana stats: { box: 0..MAX_BOX, seen, correct }
  stats: saved.stats || {},
  // saved words: { kana: timestamp saved }
  dictionary: saved.dictionary || {},
};
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));
const statOf = kana => state.stats[kana] || (state.stats[kana] = { box: 0, seen: 0, correct: 0 });

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pool = () => ALL.filter(c => state.rows.includes(c.row));

function usableWords() {
  const known = new Set(pool().map(c => c.kana));
  return WORDS.filter(w => [...w.kana].every(ch => known.has(ch)));
}
const wordsWith = (kana, limit) => shuffle(usableWords().filter(w => w.kana.includes(kana))).slice(0, limit);

const isSaved = kana => kana in state.dictionary;
const starHtml = kana =>
  `<button class="star ${isSaved(kana) ? "on" : ""}" data-save="${kana}" title="Save to my dictionary">${isSaved(kana) ? "★" : "☆"}</button>`;

const CIRCLED = "⓪①②③④⑤⑥⑦⑧⑨";

// Which morae are high in Tokyo pitch accent: 0 = low-high-high…, 1 = high-low-low…,
// n ≥ 2 = low, high up to mora n, then low.
const isHigh = (i, accent) => accent === 0 ? i > 0 : accent === 1 ? i === 0 : i > 0 && i < accent;

function accentTitle(w) {
  const n = [...w.kana].length;
  const how = w.accent === 0 ? "flat: starts low, rises, never drops"
    : w.accent === n ? "rises, drops right after the word (on a following particle)"
    : `pitch drops after mora ${w.accent}`;
  return `Pitch accent ${w.accent}: ${how}. ${n} mora${n > 1 ? "e" : ""}.`;
}

// opts.highlight: kana to highlight. opts.hidden: during a question, hide whatever would give
// the answer away — the target kana becomes "？" in pick mode, the romaji is hidden in type mode.
function wordHtml(w, { highlight, hidden } = {}) {
  const kana = [...w.kana].map((ch, i) => {
    const shown = ch !== highlight ? ch : hidden === "kana" ? `<mark>？</mark>` : `<mark>${ch}</mark>`;
    const cls = (isHigh(i, w.accent) ? " hi" : "") + (i === w.accent - 1 ? " drop" : "");
    return `<span class="m${cls}">${shown}</span>`;
  }).join("") + `<span class="acc" title="${accentTitle(w)}">${CIRCLED[w.accent]}</span>`;
  const romaji = hidden ? "answer to reveal" : `${w.romaji} 🔊`;
  return `<div class="word ${hidden ? "locked" : ""}" ${hidden ? "" : `data-say="${w.kana}" title="Click to hear"`}>
    ${starHtml(w.kana)}
    <span class="wk">${kana}</span>${w.kanji && hidden !== "kana" ? `<span class="wj">${w.kanji}</span>` : ""}
    <span class="wr">${romaji}</span>
    <span class="wt">${w.en} <span>· ${w.zh}</span></span>
  </div>`;
}

function examplesHtml(kana, words, hidden) {
  if (!words.length) return `<p class="muted">No example words for this character with your current practice set yet.</p>`;
  const title = hidden ? "Words with this character" : `Words with ${kana} — click to hear, ☆ to save`;
  return `<h3>${title}</h3><div class="word-list">${words.map(w => wordHtml(w, { highlight: kana, hidden })).join("")}</div>`;
}

function toggleSaved(kana) {
  if (isSaved(kana)) delete state.dictionary[kana];
  else state.dictionary[kana] = Date.now();
  save();
  document.querySelectorAll(`[data-save="${kana}"]`).forEach(b => b.outerHTML = starHtml(kana));
  if ($("dictionary").classList.contains("active")) renderDictionary();
}

// ☆ buttons save words; any other element with data-say speaks its text when clicked.
document.addEventListener("click", e => {
  const star = e.target.closest("[data-save]");
  if (star) { toggleSaved(star.dataset.save); return; }
  const el = e.target.closest("[data-say]");
  if (el) speak(el.dataset.say);
});

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 0.8;
  const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith("ja"));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

// Leitner-style weighting: characters in lower boxes (weaker) come up far more often.
let lastKana = null;
function pickCard() {
  const p = pool();
  const candidates = p.length > 1 ? p.filter(c => c.kana !== lastKana) : p;
  const weights = candidates.map(c => 2 ** (MAX_BOX - statOf(c.kana).box));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i];
  }
  return candidates[candidates.length - 1];
}

// ---------- Practice ----------
const session = { correct: 0, total: 0, streak: 0 };
let current = null, answered = false, currentMode = null, currentWords = [];

function renderRowToggles() {
  $("rowToggles").innerHTML = ROWS.map(r => {
    const on = state.rows.includes(r.id);
    const sample = r.chars.find(Boolean)[0];
    return `<label class="${on ? "on" : ""}"><input type="checkbox" value="${r.id}" ${on ? "checked" : ""}>${sample} ${r.label}</label>`;
  }).join("");
  $("rowToggles").querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
    const sel = [...$("rowToggles").querySelectorAll("input:checked")].map(i => i.value);
    if (sel.length === 0) { inp.checked = true; return; }  // keep at least one row
    state.rows = sel;
    save();
    renderRowToggles();
    renderChart();
    nextCard();
  }));
}

function nextCard() {
  current = pickCard();
  lastKana = current.kana;
  answered = false;
  currentMode = state.mode === "mixed" ? (Math.random() < 0.5 ? "type" : "pick") : state.mode;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("nextBtn").style.display = "none";

  const prompt = $("prompt");
  if (currentMode === "type") {
    $("hint").textContent = "How do you read this?";
    prompt.textContent = current.kana;
    prompt.className = "prompt";
    $("answerArea").innerHTML = `<input class="answer-input" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="romaji">`;
    const input = $("answer");
    input.focus();
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !answered && input.value.trim()) {
        // preventDefault stops this Enter from also "clicking" the Next button once it has focus
        e.preventDefault(); e.stopPropagation(); checkTyped(input.value);
      }
    });
  } else {
    $("hint").textContent = "Which kana is this?";
    prompt.textContent = current.romaji;
    prompt.className = "prompt romaji";
    const others = shuffle(pool().filter(c => c.kana !== current.kana)).slice(0, 3);
    const options = shuffle([current, ...others]);
    $("answerArea").innerHTML = `<div class="choices">${options.map((o, i) =>
      `<button data-kana="${o.kana}"><small>${i + 1}</small>${o.kana}</button>`).join("")}</div>`;
    $("answerArea").querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => checkPicked(b.dataset.kana)));
  }
  // Show example words right away, hiding the part that would give away the answer.
  currentWords = wordsWith(current.kana, 3);
  $("examples").innerHTML = examplesHtml(current.kana, currentWords, currentMode === "type" ? "romaji" : "kana");
}

function checkTyped(value) {
  const ok = current.accepted.includes(value.trim().toLowerCase());
  $("answer").disabled = true;
  grade(ok);
}

function checkPicked(kana) {
  if (answered) return;
  const ok = kana === current.kana;
  $("answerArea").querySelectorAll("button").forEach(b => {
    b.disabled = true;
    if (b.dataset.kana === current.kana) b.classList.add("correct");
    else if (b.dataset.kana === kana) b.classList.add("wrong");
  });
  if (!ok) {
    const picked = ALL.find(c => c.kana === kana);
    $("hint").textContent = `${picked.kana} is "${picked.romaji}"`;
  }
  grade(ok);
}

function grade(ok) {
  answered = true;
  const s = statOf(current.kana);
  s.seen++;
  session.total++;
  if (ok) {
    s.correct++;
    s.box = Math.min(MAX_BOX, s.box + 1);
    session.correct++;
    session.streak++;
    state.bestStreak = Math.max(state.bestStreak, session.streak);
  } else {
    s.box = 0;
    session.streak = 0;
  }
  save();

  const fb = $("feedback");
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.textContent = ok
    ? `Correct! ${current.kana} = ${current.romaji}`
    : `Not quite — ${current.kana} is "${current.romaji}"`;
  if (state.autoSpeak) speak(current.kana);

  $("sCorrect").textContent = session.correct;
  $("sTotal").textContent = session.total;
  $("sStreak").textContent = session.streak;
  $("sBest").textContent = state.bestStreak;

  // Stay on the card so the example words can be read; Enter / Next moves on.
  $("examples").innerHTML = examplesHtml(current.kana, currentWords);
  $("nextBtn").style.display = "";
  document.activeElement?.blur();
}

document.addEventListener("keydown", e => {
  if (!$("practice").classList.contains("active")) return;
  if (answered && e.key === "Enter") { e.preventDefault(); nextCard(); return; }
  if (!answered && currentMode === "pick" && /^[1-4]$/.test(e.key)) {
    const btn = $("answerArea").querySelectorAll("button")[+e.key - 1];
    if (btn) btn.click();
  }
});

$("nextBtn").addEventListener("click", nextCard);
$("speakBtn").addEventListener("click", () => current && speak(current.kana));
$("mode").value = state.mode;
$("mode").addEventListener("change", e => { state.mode = e.target.value; save(); nextCard(); });
$("autoSpeak").checked = state.autoSpeak;
$("autoSpeak").addEventListener("change", e => { state.autoSpeak = e.target.checked; save(); });

// ---------- Chart & Progress ----------
function gridHtml(cellFn) {
  const vowels = ["a", "i", "u", "e", "o"];
  return `<table class="chart"><tr><th></th>${vowels.map(v => `<th>${v}</th>`).join("")}</tr>` +
    ROWS.map(r => `<tr><th>${r.label}</th>${r.chars.map(c => c ? cellFn(ALL.find(x => x.kana === c[0])) : `<td class="cell empty"></td>`).join("")}</tr>`).join("") +
    `</table>`;
}

function renderChart() {
  $("chartTable").innerHTML = gridHtml(c =>
    `<td class="cell ${state.rows.includes(c.row) ? "" : "off"}" data-kana="${c.kana}"><span class="k">${c.kana}</span><span class="r">${c.accepted.join(" / ")}</span></td>`);
  $("chartTable").querySelectorAll("td[data-kana]").forEach(td =>
    td.addEventListener("click", () => {
      speak(td.dataset.kana);
      $("chartWords").innerHTML = examplesHtml(td.dataset.kana, wordsWith(td.dataset.kana, 6));
    }));
  $("chartWords").innerHTML = "";
}

function renderWords() {
  const words = usableWords().sort((a, b) => a.kana.localeCompare(b.kana, "ja"));
  $("wordsInfo").textContent = `${words.length} words you can read with your practice set. Click a word to hear it, ☆ to save it — enable more rows to unlock more. The circled number is the pitch accent: the line over the kana shows high pitch, and the tick marks where it drops (⓪ = never drops).`;
  $("wordsList").innerHTML = words.map(w => wordHtml(w)).join("");
}

function renderDictionary() {
  const entries = Object.entries(state.dictionary).sort((a, b) => b[1] - a[1]);
  $("dictInfo").textContent = entries.length
    ? `${entries.length} saved word${entries.length > 1 ? "s" : ""}, newest first. Click to hear, ★ to remove.`
    : "Your dictionary is empty. Click ☆ on any word to save it here.";
  $("dictList").innerHTML = entries.map(([kana, ts]) => {
    const w = WORDS.find(x => x.kana === kana);
    return w ? wordHtml(w).replace("</div>", `<span class="wd">saved ${new Date(ts).toLocaleDateString()}</span></div>`) : "";
  }).join("");
}

function renderProgress() {
  $("progressTable").innerHTML = gridHtml(c => {
    const s = state.stats[c.kana];
    const level = !s || s.seen === 0 ? 0 : 1 + Math.min(4, s.box);
    const acc = s && s.seen ? `${Math.round(100 * s.correct / s.seen)}% · ${s.seen}×` : "—";
    return `<td class="cell m${level} ${state.rows.includes(c.row) ? "" : "off"}"><span class="k">${c.kana}</span><span class="r">${acc}</span></td>`;
  });
  const weak = pool()
    .filter(c => state.stats[c.kana]?.seen)
    .sort((a, b) => statOf(a.kana).box - statOf(b.kana).box ||
                    statOf(a.kana).correct / statOf(a.kana).seen - statOf(b.kana).correct / statOf(b.kana).seen)
    .slice(0, 5);
  $("weakList").innerHTML = weak.length
    ? `<p class="muted">Needs the most practice:</p>${weak.map(c => `<span title="${c.romaji}">${c.kana}</span>`).join("")}`
    : `<p class="muted">Practice a bit and your weakest characters will show up here.</p>`;
}

$("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all progress? This cannot be undone.")) return;
  state.stats = {};
  state.bestStreak = 0;
  save();
  renderProgress();
});

// ---------- Navigation ----------
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === b.dataset.view));
  if (b.dataset.view === "progress") renderProgress();
  if (b.dataset.view === "words") renderWords();
  if (b.dataset.view === "dictionary") renderDictionary();
  if (b.dataset.view === "practice" && currentMode === "type" && !answered) $("answer")?.focus();
}));

// ---------- Init ----------
$("sBest").textContent = state.bestStreak;
renderRowToggles();
renderChart();
nextCard();
</script>
</body>
</html>
